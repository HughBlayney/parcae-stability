# Recurrence-ablated control for parcae-medium-370m.
# Identical to parcae-medium-370m.yaml except that the core block runs exactly once.
# Token-matched to the recurrent run (same max_tokens => same data, same optimizer steps).
#
# micro_batch_size is tuned for 4 GPUs and requires <= 4 ranks: grad accum is derived as
# (world_batch_size // num_nodes // devices) // micro_batch_size and asserted > 0, so
# 256 // devices must be >= micro_batch_size. Drop it back to 16 to run on 8 ranks.
run_name: parcae-medium-370m-rec1
resume: False
max_tokens: 29_600_000_000
seed: 42
out_dir: "/datasets/scro3801/parcae-outputs/parcae-medium-370m-rec1"
model_name: parcae-medium-370m
model_impl: dynamic
block_size: 2048

# Only one depth exists; the eval loop appends mean_recurrence (=1) automatically.
partial_depth_eval: []

model_overwrite:
  vocab_size: 32768
  prelude_norm: true
  # --- the ablation ---
  mean_recurrence: 1
  # Must equal mean_recurrence: the sampler uses t = max(mean_recurrence - mean_backprop_depth, 0)
  # and s = mean_backprop_depth. Leaving the default 4 would run 4 steps; setting 0 would run the
  # single step under no_grad and silently never train the core block.
  mean_backprop_depth: 1
  # "fixed" => n=t=0, k=s=1 exactly. The default poisson-truncated-full would draw
  # total = clamp(Poisson(1), min=1), averaging ~1.42 iterations rather than 1.
  sampling_scheme: fixed

world_batch_size: 256
micro_batch_size: 32   # 4 GPUs -> grad accum 2. Neutral: world batch is still 256.
# Was 64, which OOM'd on 80 GB A100s (job 50976, 2026-09-18): 76.5 GiB already in use when the
# 8.0 GiB logits tensor (64 x 2048 x 32768 x bf16) was allocated. 12 layers at d=1024 is ~2.7x
# the activation footprint of small-140m, which itself peaked at 76.3 GB reserved at mbs=64.

optimizer: MuonAdamW
optim_config:
  lr: 8e-3
  weight_decay: 0.0
  betas: [0.8, 0.95]
  eps: 1e-10
  muon_lr: 8e-3
  muon_momentum: 0.95
  muon_wd: 0.2
  muon_ns_steps: 5

warmup_steps: 0.0
cooldown_steps: 0.5
lr_schedule: trapezoid
min_lr: 0
grad_clip: 1.0
no_weight_decay_for_bias_and_norm_params: True

z_regularization: 0
label_smoothing: 0

fabric_strategy: ddp
fabric_precision: bf16-mixed
fabric:
  optim_sharding: False

compile_model: True
gradient_checkpointing: False

loss_guardrail_active: True
skip_nonfinite_grads: True
allow_nonfinite_loss: False

logger_project: "parcae"
model_telemetry: True
log_step_interval: 1
save_step_interval: 8192   # ~56k steps total -> saves ~7x; rotation keeps only the newest.
eval_step_interval: 1024
eval_iters: 16
save_last_step: True
keep_last_n_checkpoints: 1   # rotation: delete older checkpoints, keep only the newest.
                             # Pruning happens after the new save completes, so disk
                             # transiently holds 2 checkpoints and a crash mid-save
                             # cannot destroy the previous good one.

all_block_size_tensors: False
pack_sequences: True

data_config:
  train_data:
    - type: pqds-pure
      prefix: ""
      weight: 1
      data_dir: "${PARCAE_DATA}/fineweb-edu-100b-shuffle/train"
      data_signature:
        keys: ["text"]
  val_data:
    - type: pqds-pure
      prefix: ""
      weight: 1
      data_dir: "${PARCAE_DATA}/fineweb-edu-100b-shuffle/val"
      data_signature:
        keys: ["text"]

tokenizer_path: "${PARCAE_DATA}/tokenizer/parcae_tokenizer"
